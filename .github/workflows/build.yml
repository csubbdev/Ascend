name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            compiler: g++
            artifact: ascend-linux-x64
          - name: Linux (Clang)
            os: ubuntu-latest
            compiler: clang++
          - name: macOS
            os: macos-latest
            artifact: ascend-macos-arm64
          - name: Windows (MSVC)
            os: windows-latest
            artifact: ascend-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        if: ${{ !matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure with ${{ matrix.compiler }}
        if: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload the interpreter and package manager
        if: ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/ascend
            build/apkg
            build/Release/ascend.exe
            build/Release/apkg.exe
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Newer kernels use more address randomization than older ASan runtimes expect.
      - name: Make address randomization compatible with ASan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
